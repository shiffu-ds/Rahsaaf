[project]
name = "rahsaaf"
version = "0.1.0"
description = "Real-time illegal parking detection and alert system"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ultralytics>=8.3.0",
    "torch>=2.4",
    "torchvision>=0.19",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "lap>=0.5.12",
    "openvino>=2024.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyjwt>=2.8",
    "fast-alpr[onnx]>=0.4.0",
]

[dependency-groups]
dev = ["pytest>=8"]

# CPU-only PyTorch: this machine has no GPU, and the default wheels would
# download several gigabytes of unused CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
